# --- Server ---
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/vanaspati_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.cache.redis.time-to-live=${REDIS_CACHE_TTL_MS:86400000}

# --- JWT ---
jwt.secret=${JWT_SECRET:your_base64_encoded_secret_minimum_256_bits_here}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- Mail (for password reset) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your@email.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- File Upload ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# --- Logging ---
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.vanaspati=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}

# --- Actuator / Health ---
management.endpoints.web.exposure.include=${MANAGEMENT_EXPOSED_ENDPOINTS:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
