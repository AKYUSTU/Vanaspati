<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">Herb image placeholder</title>
  <desc id="desc">Minimal green placeholder with a leaf symbol for missing herb photos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf6e7"/>
      <stop offset="100%" stop-color="#d8edd1"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eac63"/>
      <stop offset="100%" stop-color="#2f8f45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g transform="translate(320 240)">
    <path d="M-8 102 C-2 68 2 38 8 2" fill="none" stroke="#2f8f45" stroke-width="10" stroke-linecap="round"/>
    <path d="M8 2 C66 -18 112 -72 122 -130 C68 -126 24 -96 0 -42" fill="url(#leaf)"/>
    <path d="M-8 28 C-66 4 -112 -50 -122 -108 C-68 -104 -24 -74 0 -20" fill="url(#leaf)" opacity="0.95"/>
  </g>
  <text x="320" y="430" text-anchor="middle" fill="#2b5d3f" font-size="22" font-family="Verdana, Geneva, sans-serif" letter-spacing="0.08em">
    IMAGE COMING SOON
  </text>
</svg>
